version: '0.1.0'
delivery_level: preproduction_text
delivery_level_media: preproduction_text_and_reference_media
repair_limit: 2
media_profile:
  model: gpt-image-2.5-flare-vip
  quality: low
  format: png
stages:
  - id: story
    skill: '$writer'
    role: writer
    artifact_type: story
    inputs: [brief, route]
    depends_on: []
  - id: story_review
    skill: script-review
    role: reviewer
    artifact_type: review
    inputs: [brief, route, story]
    depends_on: [story]
    reviews: story
    criteria: [constraints, causality, visualization, duration, route_fit]
    human_gate: true
  - id: style
    skill: art-direction
    role: art-director
    artifact_type: style
    inputs: [brief, route, story]
    depends_on: [story_review]
  - id: style_review
    skill: production-review
    role: reviewer
    artifact_type: review
    inputs: [brief, story, style]
    depends_on: [style]
    reviews: style
    criteria: [story_fit, coherence, executability]
    human_gate: true
  - id: storyboard
    skill: storyboard-direction
    role: storyboard-director
    artifact_type: storyboard
    inputs: [brief, story, style]
    depends_on: [style_review]
  - id: storyboard_review
    skill: storyboard-review
    role: reviewer
    artifact_type: review
    inputs: [brief, story, style, storyboard]
    depends_on: [storyboard]
    reviews: storyboard
    criteria: [narrative, space, continuity, rhythm, style, sound, feasibility]
    human_gate: true
  - id: assets
    skill: asset-planning
    role: production-planner
    artifact_type: assets
    inputs: [brief, style, storyboard]
    depends_on: [storyboard_review]
  - id: assets_review
    skill: production-review
    role: reviewer
    artifact_type: review
    inputs: [style, storyboard, assets]
    depends_on: [assets]
    reviews: assets
    criteria: [coverage, identity, state]
  - id: edit_sound
    skill: edit-sound-plan
    role: editor
    artifact_type: edit_sound
    inputs: [brief, story, storyboard]
    depends_on: [storyboard_review]
  - id: edit_sound_review
    skill: production-review
    role: reviewer
    artifact_type: review
    inputs: [brief, storyboard, edit_sound]
    depends_on: [edit_sound]
    reviews: edit_sound
    criteria: [coverage, motivation, sound_space]
  - id: asset_media
    media: true
    skill: generate-media
    role: media-artist
    artifact_type: media
    inputs: [brief, style, assets]
    depends_on: [assets_review]
    fanout:
      source: assets
      select_kinds: [character, space]
      reference_flag: reference_image
      size_by_kind:
        character: 1024x1536
        space: 1280x720
      default_size: 1024x1024
      skill_by_kind:
        character: character-visual-design
        space: scene-visual-design
  - id: asset_media_review
    media: true
    skill: production-review
    role: reviewer
    artifact_type: review
    inputs: [style, assets, asset_media]
    depends_on: [asset_media]
    reviews: asset_media
    criteria: [coverage, prompt_fidelity, constraint_compliance]
    human_gate: true
  - id: board_media
    media: true
    skill: generate-media
    role: media-artist
    artifact_type: media
    inputs: [brief, style, storyboard]
    depends_on: [storyboard_review]
    fanout:
      source: storyboard
      group_by: scene_id
      default_size: 1280x720
      skill_by_kind:
        board: storyboard-panel-prompts
  - id: board_media_review
    media: true
    skill: production-review
    role: reviewer
    artifact_type: review
    inputs: [brief, storyboard, board_media]
    depends_on: [board_media]
    reviews: board_media
    criteria: [coverage, prompt_fidelity, constraint_compliance]
    human_gate: true
  - id: video_prompts
    media: true
    skill: video-shot-prompts
    role: video-prompt-writer
    artifact_type: fanout_set
    item_artifact: video_prompt
    inputs: [brief, style, storyboard, edit_sound, board_media]
    depends_on: [board_media_review, edit_sound_review]
    fanout:
      source: storyboard
      mode: per_shot
  - id: video_prompts_review
    media: true
    skill: production-review
    role: reviewer
    artifact_type: review
    inputs: [brief, storyboard, video_prompts]
    depends_on: [video_prompts]
    reviews: video_prompts
    criteria: [coverage, shot_fidelity, camera_sound_binding]
    human_gate: true
